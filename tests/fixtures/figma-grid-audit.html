<!doctype html><html><meta charset="utf-8"><title>跨列 Grid 导出验收</title><style>body{margin:0;font:14px system-ui}#tools{display:flex;gap:12px;align-items:center;height:60px;padding:0 12px}iframe{width:1440px;height:900px;border:0}pre{white-space:pre-wrap}textarea[hidden]{display:none}</style><div id="tools"><button id="capture">捕获跨列布局</button><pre id="status">等待页面</pre></div><iframe id="page"></iframe><textarea id="payload" hidden></textarea><textarea id="audit" hidden></textarea><textarea id="source-audit" hidden></textarea><script type="module">
import{serializeCaptureDocument}from'/services/captureSnapshot.ts';import{convertPageToFigma,prepareFigmaClipboard}from'/services/figmaClipboardService.ts';
const frame=document.querySelector('#page');frame.src=new URL(location.href).searchParams.get('target');document.querySelector('#capture').onclick=async()=>{try{
 const doc=frame.contentDocument;document.querySelector('#source-audit').value=JSON.stringify(Array.from(doc.querySelectorAll('div,span,p,h1,h2,h3,header,nav')).filter(e=>{const text=e.textContent.trim();return text.length<100&&/当前存在|项异常|剩余电量|^82|^%|^运行监控$/.test(text)}).map(e=>{const chain=[];for(let n=e;n&&chain.length<4;n=n.parentElement){const css=doc.defaultView.getComputedStyle(n),rect=n.getBoundingClientRect();chain.push({tag:n.tagName,id:n.id,cls:n.className,text:n===e?n.textContent:undefined,rect:{x:rect.x,y:rect.y,w:rect.width,h:rect.height},display:css.display,position:css.position,margin:css.margin,padding:css.padding,transform:css.transform,whiteSpace:css.whiteSpace,align:css.alignItems,justify:css.justifyContent})}return chain}));const snapshot=serializeCaptureDocument(doc),source={html:snapshot.html,baseUrl:doc.URL,width:1440,height:900};const result=await convertPageToFigma(source,'监控页面跨列修复','auto');const nodes=result.document.nodeChanges;const parsed=new DOMParser().parseFromString(snapshot.html,'text/html');const grids=result.trace.entries.filter(t=>t.tag!=='#text').flatMap(t=>{const node=nodes.find(n=>n.guid.localID===t.guid.localID);const el=t.domPath===':scope'?parsed.body:parsed.body.querySelector(t.domPath);if(!el||node?.stackMode!=='GRID')return[];return[{className:el.className,columns:node.gridColumns?.entries.length,items:nodes.filter(n=>n.parentIndex?.guid.localID===node.guid.localID).map(n=>({name:n.name,span:n.gridColumnSpan,rowSpan:n.gridRowSpan}))}]});
 document.querySelector('#audit').value=JSON.stringify({nodes,trace:result.trace});document.querySelector('#payload').value=await prepareFigmaClipboard(source,'监控页面跨列修复','auto');document.querySelector('#status').textContent=JSON.stringify({passed:parsed.querySelector('.rm2')?(()=>{const find=selector=>{const el=parsed.querySelector(selector),t=result.trace.entries.find(t=>t.tag!=='#text'&&parsed.body.querySelector(t.domPath)===el);return t&&nodes.find(n=>n.guid.localID===t.guid.localID)};const main=find('.rm2-dashboard'),layer=find('.rm2'),title=find('#rm2-alert-title'),percent=nodes.find(n=>n.type==='TEXT'&&n.textData?.characters==='%'),parent=percent&&nodes.find(n=>n.guid.localID===percent.parentIndex?.guid.localID);return main?.stackPrimarySizing==='FIXED'&&layer?.stackPrimarySizing==='FIXED'&&title?.stackMode==='HORIZONTAL'&&title?.stackCounterAlignItems==='BASELINE'&&parent?.stackMode==='HORIZONTAL'})():grids.some(g=>g.columns===12&&g.items.map(i=>i.span).join(',')==='7,5'),grids},null,2);
 }catch(e){document.querySelector('#status').textContent='FAIL '+e.message}};
</script></html>
