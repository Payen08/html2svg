<!doctype html><html><meta charset="utf-8"><title>整页边距与双地图验收</title><style>*{box-sizing:border-box}body{margin:0;font:14px sans-serif}.app{width:1200px;height:850px;display:flex;background:#f0f0f6}.sidebar{width:124px;flex-shrink:0;background:#fafafa;padding:20px}.content{flex:1;min-width:0;display:flex;flex-direction:column}.head{height:70px;flex-shrink:0;background:white;padding:20px 24px}.main{padding:36px 60px;flex:1;min-height:0;display:flex;flex-direction:column}.page{margin:-36px -60px;padding:16px 24px;height:780px;display:flex;flex-direction:column}.panel{width:100%;height:100%;background:white;display:flex;flex-direction:column;border-radius:16px;overflow:hidden}.title{padding:16px 24px;border-bottom:1px solid #ddd}.body{padding:18px 24px 24px;display:flex;flex-direction:column;gap:16px;flex:1;min-height:0;overflow:hidden}.maps{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}.map{min-width:0;background:#f7f8fa;border:1px solid #ddd;border-radius:12px;padding:12px 14px 14px}.map h3{margin:0 0 8px;font-size:14px}.viewport{height:430px;position:relative;background:white;border:1px solid #ddd;overflow:hidden}.viewport svg{width:100%;height:100%;display:block}.tools{position:absolute;right:10px;top:10px;background:white;padding:6px}.footer{padding:12px;background:#f7f8fa}</style><div class="app" id="sample"><aside class="sidebar">天工<br>地图映射</aside><div class="content"><header class="head">No.1 排序园区</header><main class="main"><section class="page"><div class="panel"><header class="title">Payen</header><div class="body"><div class="maps"><section class="map"><h3>基准 SLAM 地图</h3><div class="viewport"><svg viewBox="0 0 400 400"><image href="map-test.svg" width="400" height="400"/><circle cx="180" cy="190" r="6" fill="#241f7d"/></svg><div class="tools">＋<br>－</div></div></section><section class="map"><h3>映射 SLAM 地图</h3><div class="viewport"><svg viewBox="0 0 400 400"><g transform="rotate(-14 200 200)"><image href="map-test.svg" width="400" height="400"/></g><circle cx="210" cy="190" r="6" fill="#00b42a"/></svg><div class="tools">＋<br>－</div></div></section></div><div class="footer">参考点与误差校验</div></div></div></section></main></div></div><button id="verify">验证整页导出</button><textarea id="payload" hidden></textarea><pre>等待验证</pre><script type="module">import{prepareFigmaClipboard}from'/services/figmaClipboardService.ts';import{decodeFigmaData,parseClipboardHtml}from'@figit/fig-kiwi';document.querySelector('#verify').onclick=async()=>{try{const html='<!doctype html><html><head>'+document.querySelector('style').outerHTML+'</head><body>'+document.querySelector('#sample').outerHTML+'</body></html>';const payload=await prepareFigmaClipboard({html,baseUrl:location.href,width:1200,height:850},'整页边距与地图验收');document.querySelector('#payload').value=payload;const ns=decodeFigmaData(parseClipboardHtml(payload).fig).message.nodeChanges;document.querySelector('pre').textContent=JSON.stringify({passed:ns.some(n=>n.stackMode==='GRID')&&ns.filter(n=>n.fillPaints?.some(p=>p.type==='IMAGE')).length===2,images:ns.filter(n=>n.fillPaints?.some(p=>p.type==='IMAGE')).length,main:ns.filter(n=>n.name==='Main'||n.name==='main'),grids:ns.filter(n=>n.stackMode==='GRID')},null,2)}catch(e){document.querySelector('pre').textContent='FAIL: '+e.message}};</script></html>
