<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>竖屏预览滚动验证</title>
<style>*{box-sizing:border-box}body{margin:0;font:28px sans-serif;background:#e7f5ee}.page{width:1080px;height:1920px;position:relative;padding:60px;border:8px solid #008c65}h1{margin:0;font-size:48px}button{padding:16px 24px;font:inherit;background:white;border:2px solid #008c65;border-radius:12px}.scrollbox{width:480px;height:160px;overflow:auto;background:white;border:2px solid #008c65;margin-top:24px;padding:16px}.long{height:600px;background:linear-gradient(#fff,#b0e2d0)}.bottom{position:absolute;bottom:40px;left:60px;right:60px;background:#008c65;color:white;padding:24px;text-align:center}</style>
</head><body><main class="page"><h1>1080 × 1920 竖屏</h1><p>适应窗口可看到完整页面</p><button id="action">点击次数：0</button><div class="scrollbox" aria-label="页面内滚动区域"><div class="long">页面内滚动区域</div></div><div class="bottom">页面底部 · 1920 px</div></main><script>let count=0;document.querySelector('#action').onclick=()=>document.querySelector('#action').textContent='点击次数：'+(++count);</script></body></html>
