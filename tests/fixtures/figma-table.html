<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>表格 Auto Layout 验收</title><style>body{font:14px 'PingFang SC',sans-serif;padding:24px}table{width:900px;border-collapse:collapse;color:#374151;line-height:1.5}th,td{padding:8px 12px;text-align:left;border-bottom:1px solid #e5e7eb;font-weight:400}th{background:#f3f4f6}td{text-align:right}button{margin:20px 8px 0 0}</style><table id="table"><thead><tr><th style="width:54px">编号</th><th style="min-width:120px">基准地图名称</th><th style="min-width:150px">基准坐标（m）</th><th style="min-width:120px">映射地图名称</th><th style="width:100px;text-align:center">操作</th></tr></thead><tbody><tr><td>P1</td><td>fileone</td><td>19.978 / 14.932</td><td>地图3栋1层</td><td>编辑</td></tr><tr><td>P2</td><td>fileone</td><td>24.168 / 11.354</td><td>待标定</td><td>删除</td></tr><tr><td colspan="5">新增参考点 Add reference point</td></tr></tbody></table><button id="verify">验证共享列规则</button><button id="copy">复制 Figma 表格</button><textarea id="payload" aria-label="原生剪贴板数据" hidden></textarea><pre role="status">等待验证</pre><script type="module">
import {prepareFigmaClipboard,copyFigmaToClipboard} from '/services/figmaClipboardService.ts';
import {parseClipboardHtml,decodeFigmaData} from '@figit/fig-kiwi';
const source=()=>({html:'<!doctype html><html><head>'+document.querySelector('style').outerHTML+'</head><body style="margin:0;padding:0">'+document.querySelector('table').outerHTML+'</body></html>',baseUrl:location.href,width:1000,height:500});
document.querySelector('#verify').onclick=async()=>{try{const payload=await prepareFigmaClipboard(source(),'共享列自动布局表格','auto');document.querySelector('#payload').value=payload;const nodes=decodeFigmaData(parseClipboardHtml(payload).fig).message.nodeChanges;const grid=nodes.find(n=>n.stackMode==='GRID');if(!grid||grid.gridColumns.entries.length!==5||grid.gridRows.entries.length!==4)throw Error('Grid共享列缺失');const cells=nodes.filter(n=>n.parentIndex?.guid.localID===grid.guid.localID);if(cells.length!==16||!cells.some(n=>n.gridColumnSpan===5))throw Error('单元格或合并列缺失');document.querySelector('pre').textContent=JSON.stringify({passed:true,grid,cells:cells.map(n=>({name:n.name,row:n.gridRowAnchor,column:n.gridColumnAnchor,span:n.gridColumnSpan}))},null,2)}catch(e){document.querySelector('pre').textContent='FAIL: '+e.message}};
document.querySelector('#copy').onclick=async()=>{await copyFigmaToClipboard(source(),'共享列自动布局表格');document.querySelector('pre').textContent='已复制共享列自动布局表格'};
</script></html>
