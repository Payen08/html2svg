<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Figma 整页回归套件</title><style>body{font:14px system-ui;margin:24px;background:#f4f5f8}button{padding:10px 16px}pre{white-space:pre-wrap;background:white;padding:16px}textarea[hidden]{display:none}</style><h1>Figma 整页回归</h1><button id="run">运行全部布局回归</button><pre id="status" role="status">尚未运行</pre><textarea id="packets" hidden></textarea><script type="module">
import{convertPageToFigma}from'/services/figmaClipboardService.ts';import{encodeFigmaData,composeClipboardHtml,decodeFigmaData}from'@figit/fig-kiwi';
const fromFixture=async(file,selector)=>{const text=await fetch(file).then(r=>r.text()),doc=new DOMParser().parseFromString(text,'text/html');return'<!doctype html><html><head>'+Array.from(doc.querySelectorAll('style')).map(e=>e.outerHTML).join('')+'</head><body style="margin:0">'+doc.querySelector(selector).outerHTML+'</body></html>'};
const page=(style,body)=>`<!doctype html><html><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;font:16px 'PingFang SC',sans-serif;color:#172554}${style}</style><body>${body}</body></html>`;
const frame=(nodes,name)=>nodes.find(n=>n.type==='FRAME'&&(n.name===name||n.name.endsWith('/ '+name)));
const assert=(condition,message)=>{if(!condition)throw Error(message)};
const cases=[
 {name:'cards',label:'卡片、文字与按钮自适应',file:'figma-copy.html',selector:'#sample',w:600,h:400,check(ns){assert(frame(ns,'actions')?.stackMode==='HORIZONTAL','按钮行丢失');assert(ns.filter(n=>n.type==='TEXT').length>=4,'文字丢失');assert(ns.some(n=>n.type==='VECTOR'),'图标丢失')}},
 {name:'page',label:'整页分栏与地图图像',file:'figma-page.html',selector:'#sample',w:1200,h:850,check(ns){assert(ns.some(n=>n.stackMode==='GRID'),'分栏缺失');assert(ns.filter(n=>n.fillPaints?.some(p=>p.type==='IMAGE')).length===2,'地图图像丢失')}},
 {name:'portrait',label:'竖屏、缩放与居中弹窗',file:'figma-portrait.html',selector:'#sample',w:1080,h:1920,check(ns,report){assert(report.preserved.some(p=>p.scope==='subtree'),'缩放未进入保真规则');assert(frame(ns,'design')?.stackMode==='NONE','缩放子树被重排');assert(ns.some(n=>n.type==='TEXT'&&Math.abs(n.fontSize-30)<.1),'字体缩放不匹配')}},
 {name:'table',label:'表头、数据与合并单元格',file:'figma-table.html',selector:'#table',w:1000,h:500,check(ns){const table=ns.find(n=>n.stackMode==='GRID');assert(table?.gridColumns.entries.length===5,'共享列丢失');assert(ns.some(n=>n.gridColumnSpan===5),'合并单元格丢失')}},
 {name:'controls',label:'弹窗、下拉框与复选框',w:1000,h:700,html:page('#modal{position:fixed;left:160px;top:100px;width:680px;height:400px;padding:24px;background:white;border:1px solid #ddd;border-radius:16px}header{display:flex;justify-content:space-between}h2{margin:0}select{width:100%;padding:12px}label{display:flex;align-items:center;gap:8px;margin:16px 0}footer{display:flex;justify-content:flex-end;gap:12px}button{padding:10px 16px}', '<section id="modal" role="dialog"><header><h2>页面内弹窗</h2><span>关闭</span></header><p>保留当前页面和输入状态</p><select><option>未选</option><option selected>当前机器人</option></select><label><input type="checkbox" checked>已选择地图</label><footer><button>取消</button><button>确认</button></footer></section>'),check(ns){assert(ns.find(n=>n.type==='FRAME'&&n.name.startsWith('回归 / controls')).size.y===700,'弹窗页根画板高度丢失');assert(ns.some(n=>n.type==='TEXT'&&n.textData.characters==='当前机器人'),'选中项丢失');assert(frame(ns,'Checkbox / checked'),'勾选状态丢失');assert(frame(ns,'modal')?.stackPrimarySizing==='FIXED','弹窗尺寸不稳定')}},
 {name:'position',label:'绝对定位、基线与行内单位',w:1440,h:900,html:page('#screen{position:relative;width:1440px;height:900px;background:#eee}#layer{position:absolute;inset:0}#nav{position:absolute;top:32px;left:32px;height:64px;width:1376px;padding:20px;background:white}#panel{position:absolute;top:112px;left:32px;right:32px;bottom:24px;padding:24px;background:white;display:flex;flex-direction:column;gap:20px}h2{margin:0}#battery{display:flex;align-items:baseline;gap:12px}#battery strong{display:block;font-size:38px}small{font-size:18px}', '<main id="screen"><div id="layer"><nav id="nav">导航</nav><section id="panel"><h2 id="alert">当前存在 <strong>2</strong> 项异常</h2><div id="battery"><span>剩余电量</span><strong id="value">82<small>%</small></strong></div></section></div></main>'),check(ns){assert(frame(ns,'layer')?.stackPrimarySizing==='FIXED','定位容器塌缩');assert(frame(ns,'panel')?.stackPrimarySizing==='FIXED','上下边缘约束丢失');assert(frame(ns,'alert')?.stackMode==='HORIZONTAL','混合文字拆行');assert(frame(ns,'value')?.stackCounterAlignItems==='BASELINE','百分号基线丢失')}},
 {name:'complex',label:'复杂局部保真与正常组件隔离',w:1000,h:700,html:page('#safe{display:flex;gap:12px;padding:12px}button{display:flex;gap:8px;padding:12px 24px}#even{display:flex;justify-content:space-evenly;width:800px;height:80px}#named{display:grid;grid-template-columns:200px 1fr;grid-template-rows:60px 60px;grid-template-areas:"a b" "a c";width:800px}#named div{padding:12px;background:#eef2ff}#scale{transform:scale(1.25);transform-origin:top left;width:400px;height:80px;padding:12px;background:#def}', '<div id="safe"><button>可编辑按钮</button><button>正常自动布局</button></div><div id="even"><button>左</button><button>中</button><button>右</button></div><div id="named"><div style="grid-area:a">侧栏</div><div style="grid-area:b">顶部</div><div style="grid-area:c">内容</div></div><div id="scale">缩放文字</div>'),check(ns,report){assert(report.preserved.length===3,'复杂布局支持边界错误');assert(frame(ns,'safe')?.stackMode==='HORIZONTAL','安全组件被降级');assert(frame(ns,'even')?.stackMode==='NONE'&&frame(ns,'named')?.stackMode==='NONE','不支持的排版被强制重排')}},
 {name:'tracks',label:'固定侧栏、弹性主区与跨列',w:1000,h:500,html:page('#tracks{display:grid;grid-template-columns:240px minmax(0,1fr);grid-template-rows:60px 240px;width:900px;gap:16px}#head{grid-column:span 2;background:#eef}aside,article{background:#eaf4ee;padding:20px}', '<main id="tracks"><header id="head">跨两列标题</header><aside>固定 240px 侧栏</aside><article>弹性主区</article></main>'),check(ns){const grid=ns.find(n=>n.stackMode==='GRID'),tracks=grid?.gridColumnsSizing.entries;assert(tracks?.[0].trackSize.maxSizing.type==='FIXED'&&tracks[0].trackSize.maxSizing.value===240,'固定侧栏变成弹性列');assert(tracks[1].trackSize.maxSizing.type==='FLEX','主区未自适应');assert(grid.gridRowsSizing.entries[1].trackSize.maxSizing.value===240,'固定行高丢失');assert(ns.some(n=>n.gridColumnSpan===2),'跨列丢失')}}
];
document.querySelector('#run').onclick=async()=>{const results=[],packets={};for(const c of cases){document.querySelector('#status').textContent='正在验证 '+c.label;try{const html=c.html||await fromFixture(c.file,c.selector);const result=await convertPageToFigma({html,baseUrl:location.href,width:c.w,height:c.h},'回归 / '+c.name,'auto');const encoded=encodeFigmaData(result.document),ns=decodeFigmaData(encoded.figBytes).message.nodeChanges;c.check(ns,result.layoutReport);packets[c.name]=composeClipboardHtml(encoded.base64);results.push({case:c.name,label:c.label,passed:true,report:result.layoutReport,nodes:ns.length})}catch(error){results.push({case:c.name,label:c.label,passed:false,error:error.message})}}document.querySelector('#packets').value=JSON.stringify(packets);document.querySelector('#status').textContent=JSON.stringify({passed:results.every(r=>r.passed),total:results.length,results},null,2)};
</script></html>
